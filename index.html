<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>FieldBridge</title>
<meta name="theme-color" id="themeColorMeta" content="#ffffff">
<script>
(function () {
  var t = 'light';
  try {
    var v = localStorage.getItem('fieldbridge-theme');
    if (v === 'light' || v === 'dark') t = v;
  } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="chat.css?v=2026-11-05.9">
</head>
<body>

<header class="top">
  <div class="top-title">
    <img class="top-icon" src="icon.svg" width="40" height="40" alt="">
    <div class="top-name">
      <h1>FieldBridge</h1>
      <span class="top-sub">苫小牧工場の知恵袋</span>
    </div>
    <span id="status" class="status status-wait" role="status" aria-live="polite">準備中</span>
    <span id="mockBadge" class="badge" hidden>仮の応答</span>
  </div>
  <div class="top-actions">
    <button type="button" id="themeBtn" class="btn theme-btn" aria-label="暗い表示にする">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" id="resetBtn" class="btn">会話をリセット</button>
    <button type="button" id="settingsBtn" class="btn">設定</button>
  </div>
</header>

<p class="notice">AI が資料をもとに答えています</p>
<p id="offlineBanner" class="offline" hidden>通信できません。接続が戻ると送信できます。</p>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<main id="log" class="log" aria-live="polite"></main>

<form id="form" class="composer" autocomplete="off">
  <label for="input" class="sr-only">質問</label>
  <textarea id="input" rows="2" maxlength="200" placeholder="質問を入力（200字まで）"></textarea>
  <button type="submit" id="sendBtn" class="btn btn-primary send-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14 21 3"/><path d="M21 3l-6.5 18a.55.55 0 0 1-1 0L10 14l-7-3.5a.55.55 0 0 1 0-1L21 3z"/></svg>
    <span>送信</span>
  </button>
</form>

<dialog id="settingsDlg" class="dlg">
  <form method="dialog" id="settingsForm">
    <h2>設定</h2>
    <p id="settingsInfo" class="hint hint-strong"></p>

    <button type="button" id="importBtn" class="btn btn-primary btn-wide">接続ファイルを読み込む</button>
    <input type="file" id="connFile" class="sr-only" tabindex="-1" aria-hidden="true">
    <p class="hint">AirDrop で受け取ったファイルを選び、パスフレーズを入力すると保存されます。結果はこの画面に表示され、画面は自動では閉じません。</p>

    <details id="manualBox" class="manual">
      <summary>手入力する（通常は不要）</summary>
      <label class="field">窓口 URL
        <input type="url" id="endpointInput" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…">
      </label>
      <label class="field">トークン
        <input type="password" id="tokenInput" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
      </label>
      <label class="field">ラベル
        <input type="text" id="labelInput" autocomplete="off">
      </label>
      <button type="button" id="saveBtn" class="btn btn-primary btn-wide" disabled>保存して閉じる</button>
    </details>

    <p id="settingsMsg" class="hint err" role="alert"></p>
    <p class="hint">接続情報の保存先は、見学ガイドとは別です。削除しても見学ガイドには影響しません。</p>
    <p id="versionInfo" class="hint"></p>
    <div class="dlg-actions">
      <button type="button" id="deleteBtn" class="btn btn-danger">接続を削除</button>
      <button type="button" id="closeSettingsBtn" class="btn">閉じる</button>
    </div>
  </form>
</dialog>

<dialog id="promptDlg" class="dlg">
  <form id="promptForm">
    <h2 id="promptTitle"></h2>
    <p id="promptText" class="hint"></p>
    <input type="password" id="promptInput" class="prompt-input" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" aria-label="入力">
    <p id="promptError" class="hint err" role="alert"></p>
    <div class="dlg-actions">
      <button type="submit" class="btn btn-primary">OK</button>
      <button type="button" id="promptCancel" class="btn">キャンセル</button>
    </div>
  </form>
</dialog>

<dialog id="photoDlg" class="dlg dlg-photo">
  <img id="photoLarge" alt="">
  <p id="photoCaption" class="photo-caption"></p>
  <div class="dlg-actions">
    <button type="button" id="closePhotoBtn" class="btn">閉じる</button>
  </div>
</dialog>

<script src="chat.js?v=2026-11-05.9"></script>
</body>
</html>
